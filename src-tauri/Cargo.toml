[package]
name = "app"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2"
# Android: hand a downloaded update to the system installer (local plugin).
tauri-plugin-apkinstaller = { path = "plugins/apkinstaller" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = "0.17"
walkdir = "2.4"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.2"
chrono = "0.4"
dirs = "5.0"

diviora-dsp = { path = "../diviora-dsp" }
diviora-client = { path = "../diviora-client" }


[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "android")'.dependencies]
# In-app update download (rustls with bundled root certificates).
ureq = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Smaller, faster release builds (installer and APK). Panics stay "unwind" so the DSP's
# C interface can catch them.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Password hashing is deliberately slow (600 000 rounds); optimise it even in test builds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
