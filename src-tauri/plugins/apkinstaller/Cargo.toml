[package]
name = "tauri-plugin-apkinstaller"
version = "0.1.0"
edition = "2021"
description = "Diviora: install a downloaded app update on Android (system installer prompt)"
links = "tauri-plugin-apkinstaller"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
