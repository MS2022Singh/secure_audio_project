[package]
name = "diviora-client"
version = "0.1.0"
edition = "2021"
description = "Shared by the Diviora app and the diviora-sync service: locked APO config writer, device ID, licence/config server client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }
