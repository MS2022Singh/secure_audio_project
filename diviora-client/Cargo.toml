[package]
name = "diviora-client"
version = "0.1.0"
edition = "2021"
description = "Shared by the Diviora app and the diviora-sync service: locked APO config writer, device ID, licence/config server client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows: the system TLS stack and certificate store (Schannel).
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }

[target.'cfg(not(windows))'.dependencies]
# Android and others: rustls with bundled root certificates.
ureq = { version = "2", features = ["json"] }
