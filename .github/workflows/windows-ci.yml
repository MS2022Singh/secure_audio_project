name: windows-ci

on:
  push:
    branches: [ "feature/**", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup target add x86_64-pc-windows-msvc

      - name: DSP core tests (parser, filters, watermark)
        working-directory: diviora-dsp
        run: cargo test --release

      - name: Build native APO (DivioraAPO.dll, self-test, injector)
        shell: cmd
        run: windows-apo\build_native_apo.bat

      - name: APO self-test (drives the DLL like audiodg.exe, incl. aggregation)
        working-directory: windows-apo/build/Release
        run: .\apo_selftest.exe

      - name: Sync service build (diviora-sync)
        working-directory: diviora-sync
        run: cargo build --release

      - name: Licence server tests
        working-directory: backend
        run: |
          python -m pip install -q -r requirements.txt pytest httpx
          python -m pytest -q test_server.py

      - name: Tauri app unit tests (password hashing, config file format)
        working-directory: src-tauri
        run: cargo test --lib

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the Windows installer (unsigned test build)
        run: |
          npm install
          npx tauri build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: native-apo-${{ github.sha }}
          path: |
            windows-apo/build/Release/DivioraAPO.dll
            windows-apo/build/Release/apo_selftest.exe
            windows-apo/build/Release/injector_single_slot.exe
            diviora-sync/target/release/diviora-sync.exe
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Linux build dependencies (host tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: DSP core tests
        working-directory: diviora-dsp
        run: cargo test --release

      - name: Build optimised Android APKs (arm64 for phones, x86_64 for the emulator test)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm install
          npx tauri android init --ci
          # Package the NDK C++ runtime that oboe (audio output) needs, or the app crashes on start.
          SYS="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for pair in arm64-v8a:aarch64-linux-android x86_64:x86_64-linux-android; do
            abi=${pair%%:*}; triple=${pair#*:}
            mkdir -p "src-tauri/gen/android/app/src/main/jniLibs/$abi"
            cp "$SYS/$triple/libc++_shared.so" "src-tauri/gen/android/app/src/main/jniLibs/$abi/"
          done
          npx tauri android build --apk --split-per-abi --target aarch64 x86_64

      - name: Sign the APKs (test key, generated per build)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -keystore test.jks -storepass testpass -keypass testpass -alias test \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Diviora test build" -noprompt
          mkdir apk
          for abi in arm64 x86_64; do
            in=$(find src-tauri/gen/android/app/build/outputs/apk -path "*${abi}*" -name "*release*.apk" | head -1)
            echo "$abi: $in"
            "$BT/zipalign" -f -p 4 "$in" "apk/aligned-$abi.apk"
            "$BT/apksigner" sign --ks test.jks --ks-pass pass:testpass --key-pass pass:testpass \
              --out "apk/Diviora-android-$abi-test.apk" "apk/aligned-$abi.apk"
          done
          rm apk/aligned-*.apk
          ls -la apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on an Android emulator (fails on a crash)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/android-smoke-test.sh apk/Diviora-android-x86_64-test.apk

      - name: Upload APKs and emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diviora-android-${{ github.sha }}
          path: |
            apk/Diviora-android-arm64-test.apk
            logcat.txt

  # Publish every green build as the "test-build" pre-release: plain download links
  # (browser, phone, no sign-in) for the Windows installer and the Android APK.
  publish-test-build:
    needs: [ build-and-test, android ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Collect installer and APK
        run: |
          mkdir out
          find dl -name "*-setup.exe" -exec cp {} out/Diviora-Setup-windows-x64.exe \;
          find dl -name "Diviora-android-arm64-test.apk" -exec cp {} out/Diviora-android-arm64-test.apk \;
          ls -la out
          test -f out/Diviora-Setup-windows-x64.exe && test -f out/Diviora-android-arm64-test.apk

      - name: Replace the test-build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete test-build --repo "$REPO" --yes --cleanup-tag || true
          gh release create test-build out/* --repo "$REPO" --prerelease \
            --target "${{ github.sha }}" \
            --title "Test build (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Latest automatic test build. Windows: run Diviora-Setup-windows-x64.exe (if SmartScreen warns: More info → Run anyway). Android: install Diviora-android-arm64-test.apk (allow installing unknown apps). How to check everything: docs/ACCEPTANCE_TESTS.md. Not for distribution to users."
