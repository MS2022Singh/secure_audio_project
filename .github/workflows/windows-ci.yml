name: windows-ci

on:
  push:
    branches: [ "feature/**", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup target add x86_64-pc-windows-msvc

      - name: DSP core tests (parser, filters, watermark)
        working-directory: diviora-dsp
        run: cargo test --release

      - name: Build native APO (DivioraAPO.dll, self-test, injector)
        shell: cmd
        run: windows-apo\build_native_apo.bat

      - name: APO self-test (drives the DLL like audiodg.exe, incl. aggregation)
        working-directory: windows-apo/build/Release
        run: .\apo_selftest.exe

      - name: Sync service build (diviora-sync)
        working-directory: diviora-sync
        run: cargo build --release

      - name: Developer password tool (same hashing as the app)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\set-developer-password.ps1 -SelfTest

      - name: Licence server tests
        working-directory: backend
        run: |
          python -m pip install -q -r requirements.txt pytest httpx
          python -m pytest -q test_server.py

      - name: Tauri app unit tests (password hashing, config file format)
        working-directory: src-tauri
        run: cargo test --lib

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test-build version and update signature (public TEST key, see .github/test-signing)
        shell: pwsh
        run: |
          $v = "0.3.${{ github.run_number }}"
          $pub = (Get-Content .github/test-signing/updater-test.key.pub -Raw).Trim()
          @{ version = $v; bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $pub;
             endpoints = @("https://github.com/MS2022Singh/secure_audio_project/releases/download/test-build/latest.json") } } } |
            ConvertTo-Json -Depth 6 | Set-Content src-tauri/tauri.ci.json
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content .github/test-signing/updater-test.key -Raw).Trim())" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=diviora-test" >> $env:GITHUB_ENV
          Get-Content src-tauri/tauri.ci.json

      - name: Build the Windows installer (unsigned test build)
        run: |
          npm install
          npx tauri build --config src-tauri/tauri.ci.json

      - name: Run the installer silently and show its log (CI has no speakers, so the audio step may stop there)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(300000)) { 'installer still running after 5 minutes:'; Get-Process | Where-Object { $_.ProcessName -match 'setup|powershell|apo|injector|regsvr|sc' } | Format-Table Id, ProcessName, StartTime }
          else { "installer exit code: $($p.ExitCode)" }
          Get-ChildItem "C:\Program Files\Diviora Psychoacoustics" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if (Test-Path C:\ProgramData\Diviora\install.log) { Get-Content C:\ProgramData\Diviora\install.log } else { 'install.log missing' }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: native-apo-${{ github.sha }}
          path: |
            windows-apo/build/Release/DivioraAPO.dll
            windows-apo/build/Release/apo_selftest.exe
            windows-apo/build/Release/injector_single_slot.exe
            diviora-sync/target/release/diviora-sync.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Linux build dependencies (host tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: DSP core tests
        working-directory: diviora-dsp
        run: cargo test --release

      - name: Build the optimised Android APK (64-bit and 32-bit phones, plus x86_64 for the emulator test)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm install
          npx tauri android init --ci
          # Package the NDK C++ runtime that oboe (audio output) needs, or the app crashes on start.
          SYS="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for pair in arm64-v8a:aarch64-linux-android armeabi-v7a:arm-linux-androideabi x86_64:x86_64-linux-android; do
            abi=${pair%%:*}; triple=${pair#*:}
            mkdir -p "src-tauri/gen/android/app/src/main/jniLibs/$abi"
            cp "$SYS/$triple/libc++_shared.so" "src-tauri/gen/android/app/src/main/jniLibs/$abi/"
          done
          echo "{\"version\": \"0.3.${{ github.run_number }}\"}" > src-tauri/tauri.ci.json
          npx tauri android build --apk --target aarch64 armv7 x86_64 --config src-tauri/tauri.ci.json

      - name: Sign the APKs (fixed public TEST key, so test builds install over each other)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KS=.github/test-signing/diviora-test.jks
          in=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "built: $in"
          mkdir apk
          # Emulator test APK: all ABIs. Phone APK: the same without the x86_64 libraries.
          cp "$in" apk/all.apk
          cp "$in" apk/phone.apk
          zip -q -d apk/phone.apk 'lib/x86_64/*'
          for n in all phone; do
            "$BT/zipalign" -f -p 4 "apk/$n.apk" "apk/aligned-$n.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass pass:diviora-test --key-pass pass:diviora-test \
              --out "apk/signed-$n.apk" "apk/aligned-$n.apk"
            "$BT/apksigner" verify "apk/signed-$n.apk"
          done
          mv apk/signed-phone.apk apk/Diviora-android-test.apk
          mv apk/signed-all.apk apk/Diviora-android-emulator-test.apk
          rm apk/all.apk apk/phone.apk apk/aligned-*.apk
          unzip -l apk/Diviora-android-test.apk | grep "lib/"
          ls -la apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on an Android emulator (fails on a crash)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/android-smoke-test.sh apk/Diviora-android-emulator-test.apk

      - name: Upload APKs and emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diviora-android-${{ github.sha }}
          path: |
            apk/Diviora-android-test.apk
            logcat.txt

  # Publish every green build as the "test-build" pre-release: plain download links
  # (browser, phone, no sign-in) for the Windows installer and the Android APK.
  publish-test-build:
    needs: [ build-and-test, android ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One publish at a time, never cancelled half-way (a cancelled publish leaves a draft).
    concurrency:
      group: publish-test-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Collect installer and APK
        run: |
          mkdir out
          find dl -name "*-setup.exe" -exec cp {} out/Diviora-Setup-windows-x64.exe \;
          find dl -name "Diviora-android-test.apk" -exec cp {} out/Diviora-android-test.apk \;
          ls -la out
          test -f out/Diviora-Setup-windows-x64.exe && test -f out/Diviora-android-test.apk
          # Update manifest: Windows installs it automatically (signature checked by the app);
          # Android shows "update available".
          SIG=$(cat "$(find dl -name '*-setup.exe.sig' | head -1)")
          BASE="https://github.com/${{ github.repository }}/releases/download/test-build"
          SIG="$SIG" BASE="$BASE" V="0.3.${{ github.run_number }}" python3 -c '
          import json, os, datetime
          print(json.dumps({
            "version": os.environ["V"],
            "notes": "Diviora test build " + os.environ["V"],
            "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": {
              "windows-x86_64": {"signature": os.environ["SIG"], "url": os.environ["BASE"] + "/Diviora-Setup-windows-x64.exe"},
              "android": {"signature": "", "url": os.environ["BASE"] + "/Diviora-android-test.apk"}
            }}, indent=2))' > out/latest.json
          cat out/latest.json

      - name: Replace the test-build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Rollback: keep the build being replaced as "previous-build" (only one, no clutter).
          NEW_V="0.3.${{ github.run_number }}"
          if gh release download test-build --repo "$REPO" -D prev 2>/dev/null && [ -f prev/latest.json ]; then
            OLD_V=$(python3 -c 'import json;print(json.load(open("prev/latest.json"))["version"])')
            OLD_SHA=$(gh release view test-build --repo "$REPO" --json targetCommitish -q .targetCommitish)
            if [ "$OLD_V" != "$NEW_V" ]; then
              sed -i 's#/releases/download/test-build/#/releases/download/previous-build/#g' prev/latest.json
              gh api "repos/$REPO/releases?per_page=100" -q '.[] | select(.tag_name=="previous-build") | .id' |
                while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id" || true; done
              gh api -X DELETE "repos/$REPO/git/refs/tags/previous-build" || true
              # (Tagged at this commit: the build token may not tag older commits. The notes link
              # the source of the previous version.)
              gh release create previous-build prev/* --repo "$REPO" --prerelease --target "${{ github.sha }}" \
                --title "Previous build $OLD_V (rollback)" \
                --notes "The build before the current test build. Diviora's \"Roll back to previous version\" installs this one. Source code of this version: https://github.com/$REPO/tree/$OLD_SHA" \
                || echo "::warning::could not keep the previous build for rollback"
              gh release edit previous-build --repo "$REPO" --draft=false --prerelease || true
            fi
          fi
          # Remove every earlier test-build release, drafts included (a draft has no tag).
          gh api "repos/$REPO/releases?per_page=100" -q '.[] | select(.tag_name=="test-build") | .id' |
            while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id" || true; done
          gh api -X DELETE "repos/$REPO/git/refs/tags/test-build" || true
          gh release create test-build out/* --repo "$REPO" --prerelease \
            --target "${{ github.sha }}" \
            --title "Test build 0.3.${{ github.run_number }} (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Latest automatic test build. Windows: run Diviora-Setup-windows-x64.exe (if SmartScreen warns: More info → Run anyway). Android: install Diviora-android-test.apk (allow installing unknown apps). How to check everything: docs/ACCEPTANCE_TESTS.md. Not for distribution to users."
          # Make sure it is published (not left as a draft) and points at this build.
          gh release edit test-build --repo "$REPO" --draft=false --prerelease
          gh release view test-build --repo "$REPO" --json isDraft,assets -q '"draft=\(.isDraft) assets=\([.assets[].name] | join(","))"'
          for i in 1 2 3 4 5 6; do
            curl -sfL "https://github.com/$REPO/releases/download/test-build/latest.json" | grep '"version"' && break
            sleep 10
          done
