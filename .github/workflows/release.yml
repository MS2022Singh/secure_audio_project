name: release

# Push a tag like v0.3.0 to publish a signed installer and the auto-update feed
# (latest.json). Installed apps update themselves at their next start.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DIVIORA_SERVER_URL: ${{ secrets.DIVIORA_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        shell: pwsh
        run: |
          if (-not "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -or -not "${{ secrets.TAURI_UPDATER_PUBKEY }}") {
            throw "Set TAURI_SIGNING_PRIVATE_KEY and TAURI_UPDATER_PUBKEY (see docs/DEVELOPER_GUIDE.md, section 6)."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build native APO, self-test and sync service
        shell: cmd
        run: windows-apo\build_native_apo.bat

      - name: APO self-test
        working-directory: windows-apo/build/Release
        run: .\apo_selftest.exe

      - name: Release configuration (updater public key, signed update artifacts)
        shell: pwsh
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $env:PUBKEY } } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 src-tauri/tauri.release.json

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Diviora Psychoacoustics ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Installed copies update automatically."
          releaseDraft: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.json
